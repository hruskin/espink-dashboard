<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESPink – rozvržení</title>
<link rel="stylesheet" href="static/mdi/css/materialdesignicons.min.css">
<style>
  :root {
    --bg: #fafafa; --card: #fff; --ink: #212121; --muted: #727272; --line: #e0e0e0; --hover: rgba(0,0,0,.04);
    --primary: #03a9f4; --on-primary: #fff; --err: #db4437; --warn: #ffa600; --ok: #43a047;
    --warn-bg: #fff4e0; --err-bg: #fdecea; --shadow: 0 2px 2px rgba(0,0,0,.14), 0 1px 5px rgba(0,0,0,.12);
    --seg-a: #90caf9; --seg-b: #b0bec5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --card: #1c1c1c; --ink: #e1e1e1; --muted: #9b9b9b; --line: #333; --hover: rgba(255,255,255,.05);
            --primary: #03a9f4; --warn-bg: #3a2c10; --err-bg: #3b1714; --shadow: none; --seg-a: #1e5f8f; --seg-b: #455a64; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 Roboto, system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .mdi { font-size: 20px; line-height: 1; }

  /* app bar */
  .appbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px;
            background: var(--card); border-bottom: 1px solid var(--line); }
  .appbar h1 { font-size: 20px; font-weight: 400; margin: 0 16px 0 0; }
  .tabs { display: flex; height: 100%; }
  .tabs a { display: flex; align-items: center; padding: 0 16px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; font-weight: 500; }
  .tabs a[aria-current] { color: var(--primary); border-color: var(--primary); }
  .tabs .dot::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-left: 6px; }

  .banner { margin: 12px 16px 0; padding: 10px 14px; border-radius: 8px; display: flex; gap: 10px; align-items: center; }
  .banner.warn { background: var(--warn-bg); } .banner.warn .mdi { color: var(--warn); }
  .banner.err { background: var(--err-bg); } .banner.err .mdi { color: var(--err); }
  .banner button { margin-left: auto; }

  /* layout */
  .seg { display: none; }
  main { display: grid; grid-template-columns: 420px 1fr; gap: 16px; padding: 16px; align-items: start; padding-bottom: 96px; }
  .card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--line); }
  @media (max-width: 999px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 12px 12px 96px; }
    .seg { display: flex; position: sticky; top: 56px; z-index: 15; background: var(--bg); padding: 8px 12px; gap: 0; }
    .seg button { flex: 1; padding: 8px; border: 1px solid var(--primary); background: transparent; color: var(--primary); font-weight: 500; }
    .seg button:first-child { border-radius: 18px 0 0 18px; } .seg button:last-child { border-radius: 0 18px 18px 0; }
    .seg button[aria-pressed=true] { background: var(--primary); color: var(--on-primary); }
    body[data-pane=blocks] #previewCol, body[data-pane=preview] #editCol { display: none; }
    .tabs a { padding: 0 10px; }
    .appbar h1 { display: none; }
  }

  /* budget */
  .budget { padding: 12px 16px; margin-bottom: 12px; }
  .budget-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .bar { position: relative; display: flex; height: 22px; border-radius: 4px; overflow: hidden; background: var(--hover); }
  .bar > div { height: 100%; border-right: 2px solid var(--card); font-size: 11px; line-height: 22px; padding: 0 4px; overflow: hidden; white-space: nowrap; color: #000; cursor: pointer; }
  .bar .fill { background: repeating-linear-gradient(45deg, var(--seg-a), var(--seg-a) 5px, transparent 5px, transparent 10px); }
  .bar .over { background: var(--err); color: #fff; }
  .budget-msg { margin-top: 8px; font-size: 13px; display: flex; gap: 6px; align-items: flex-start; }
  .budget-msg.warn .mdi { color: var(--warn); } .budget-msg.err { color: var(--err); } .budget-msg.ok .mdi { color: var(--ok); }
  .budget-msg .mdi { font-size: 18px; }

  /* blocks */
  .blocks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .blk { padding: 0; }
  .blk.dragging { opacity: .4; }
  .blk.drop-before { box-shadow: 0 -3px 0 var(--primary); }
  .blk.hl, .blk.open { border-color: var(--primary); }
  .blk.hidden-blk .bhead { opacity: .55; }
  .bhead { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 4px; min-height: 56px; }
  .grip { cursor: grab; color: var(--muted); padding: 8px 2px; border: 0; background: none; touch-action: none; }
  .bicon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--hover); color: var(--primary); flex: none; }
  .btoggle { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 4px; }
  .btoggle b { font-weight: 500; font-size: 15px; display: flex; gap: 6px; align-items: center; }
  .btoggle small { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bh { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 9px; background: var(--err-bg); color: var(--err); font-weight: 500; }
  .badge.muted { background: var(--hover); color: var(--muted); }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: none; color: var(--muted); display: grid; place-items: center; flex: none; }
  .icon-btn:hover { background: var(--hover); }
  .icon-btn:disabled { opacity: .3; cursor: default; }
  .bbody { border-top: 1px solid var(--line); padding: 12px 16px 16px; }
  .bbody[hidden] { display: none; }

  /* forms */
  .f { display: block; margin-bottom: 12px; }
  .f > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .f input[type=text], .f input[type=number], .f select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  .f input:focus, .f select:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .f input[aria-invalid=true] { border-color: var(--err); }
  .ent { font-size: 12px; color: var(--muted); margin-top: 3px; min-height: 17px; }
  .ent.bad { color: var(--err); }
  .ent b { color: var(--ink); font-weight: 500; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .chk { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .chk input { width: 18px; height: 18px; accent-color: var(--primary); }
  .segbtn { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .segbtn button { border: 0; background: none; padding: 6px 12px; border-right: 1px solid var(--line); }
  .segbtn button:last-child { border-right: 0; }
  .segbtn button[aria-pressed=true] { background: var(--primary); color: var(--on-primary); }
  .calrow { display: grid; grid-template-columns: 1fr 70px 48px auto 32px; gap: 6px; align-items: start; margin-bottom: 6px; }
  .calrow input { padding: 7px 8px !important; }
  .bfoot { display: flex; gap: 4px; align-items: center; border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; }
  .bfoot .sp { flex: 1; }
  .txtbtn { background: none; border: 0; color: var(--primary); font-weight: 500; padding: 8px 10px; border-radius: 4px; display: inline-flex; gap: 4px; align-items: center; }
  .txtbtn:hover { background: var(--hover); }
  .txtbtn.danger { color: var(--err); }
  .txtbtn:disabled { color: var(--muted); cursor: default; }

  .add { position: relative; margin-top: 12px; }
  .add > .txtbtn { width: 100%; justify-content: center; border: 1px dashed var(--primary); padding: 12px; border-radius: 12px; }
  .menu { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10; padding: 6px 0; }
  .menu button { display: flex; gap: 12px; width: 100%; text-align: left; border: 0; background: none; padding: 10px 16px; align-items: center; }
  .menu button:hover:not(:disabled) { background: var(--hover); }
  .menu button:disabled { opacity: .45; cursor: default; }
  .menu small { display: block; color: var(--muted); }
  .menu .later { font-size: 11px; color: var(--muted); padding: 8px 16px 2px; text-transform: uppercase; letter-spacing: .5px; }

  /* preview */
  #previewCol { position: sticky; top: 72px; }
  .ptool { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .ptool .st { color: var(--muted); font-size: 12px; flex: 1; }
  .stage { padding: 16px; display: flex; justify-content: center; }
  .frame { position: relative; background: #2b2b2b; padding: 14px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .screen { position: relative; width: calc(480px * var(--s)); height: calc(800px * var(--s)); background: #fff; }
  .screen canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; transition: opacity .2s; }
  .screen.busy canvas { opacity: .6; }
  .spin { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border: 3px solid var(--primary); border-top-color: transparent; border-radius: 50%; animation: r 0.8s linear infinite; display: none; }
  .screen.busy .spin { display: block; }
  @keyframes r { to { transform: rotate(360deg); } }
  .band { position: absolute; left: 0; right: 0; border: 2px solid transparent; cursor: pointer; }
  .band:hover, .band.hl { border-color: var(--primary); background: rgba(3,169,244,.08); }
  .band span { position: absolute; right: 2px; top: 2px; background: var(--primary); color: #fff; font-size: 11px; padding: 0 5px; border-radius: 3px; display: none; }
  .band:hover span, .band.hl span { display: block; }
  .perr { position: absolute; left: 0; right: 0; bottom: 0; background: var(--err); color: #fff; padding: 8px 10px; font-size: 13px; display: none; }
  .screen.failed .perr { display: block; }

  /* save bar + toast */
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line);
             display: flex; align-items: center; gap: 8px; padding: 10px 16px; transform: translateY(100%); transition: transform .2s; }
  .savebar.show { transform: none; }
  .savebar .st { flex: 1; display: flex; gap: 6px; align-items: center; }
  .savebar .st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .primary { background: var(--primary); color: var(--on-primary); border: 0; border-radius: 4px; padding: 9px 18px; font-weight: 500; }
  .primary:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  .toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); background: #323232; color: #fff; padding: 12px 16px; border-radius: 6px;
           display: none; gap: 16px; align-items: center; z-index: 40; max-width: calc(100vw - 32px); }
  .toast.show { display: flex; }
  .toast button { background: none; border: 0; color: #4fc3f7; font-weight: 600; }
  .skel { background: linear-gradient(90deg, var(--hover), var(--line), var(--hover)); background-size: 200% 100%; animation: sk 1.2s infinite; border-radius: 12px; height: 56px; margin-bottom: 8px; }
  @keyframes sk { to { background-position: -200% 0; } }
  dialog { border: 0; border-radius: 12px; background: var(--card); color: var(--ink); padding: 20px; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .screen img { width: 100%; height: 100%; display: block; image-rendering: pixelated; transition: opacity .2s; }
  .screen.busy img { opacity: .6; }
  .tabs a.dot::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-left: 6px; }
  .seg button.dot::after { content: " •"; }
  .appbar .actions { margin-left: auto; display: flex; gap: 2px; }
  textarea.code { width: 100%; min-height: 120px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
                  color: var(--ink); font: 13px/1.45 ui-monospace, "JetBrains Mono", monospace; resize: vertical; }
  .f textarea:focus { outline: 2px solid var(--primary); border-color: transparent; }
  .help { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .help code { background: var(--hover); padding: 0 3px; border-radius: 3px; }
  .withbtn { display: flex; gap: 4px; align-items: center; }
  .withbtn input { flex: 1; min-width: 0; }
  .grid-on .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(3,169,244,.35) 1px, transparent 1px), linear-gradient(90deg, rgba(3,169,244,.35) 1px, transparent 1px),
                      linear-gradient(rgba(3,169,244,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(3,169,244,.12) 1px, transparent 1px);
    background-size: calc(50px * var(--s)) calc(50px * var(--s)), calc(50px * var(--s)) calc(50px * var(--s)),
                     calc(10px * var(--s)) calc(10px * var(--s)), calc(10px * var(--s)) calc(10px * var(--s)); }
  .worst { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .worst input { accent-color: var(--primary); }
  .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 4px; max-height: 50vh; overflow: auto; margin-top: 10px; }
  .icons button { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 6px 2px; display: flex; flex-direction: column;
                  align-items: center; gap: 2px; font-size: 9px; color: var(--muted); overflow: hidden; }
  .icons button .mdi { font-size: 26px; color: var(--ink); }
  .icons button:hover { border-color: var(--primary); }
  dialog { width: min(560px, calc(100vw - 32px)); max-width: none; }
  dialog input[type=search] { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  .hist { list-style: none; padding: 0; margin: 10px 0 0; max-height: 50vh; overflow: auto; }
  .hist li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .hist li span { flex: 1; }
  .hist small { color: var(--muted); display: block; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .tools { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  #boxes { position: absolute; inset: 0; }
  .gbox { position: absolute; border: 1px dashed rgba(3,169,244,.55); cursor: move; touch-action: none; }
  .gbox:hover { background: rgba(3,169,244,.06); border-style: solid; }
  .gbox.sel { border: 2px solid var(--primary); background: rgba(3,169,244,.07); z-index: 2; }
  .gbox.bad { border: 2px solid var(--err); background: rgba(219,68,55,.2); z-index: 3; }
  .glabel { position: absolute; left: 0; top: 0; background: var(--primary); color: #fff; font-size: 11px; padding: 0 5px;
            border-radius: 0 0 3px 0; display: none; pointer-events: none; white-space: nowrap; }
  .gbox:hover .glabel, .gbox.sel .glabel { display: block; }
  .gbox.bad .glabel { background: var(--err); display: block; }
  .hd { position: absolute; width: 12px; height: 12px; background: #fff; border: 2px solid var(--primary); border-radius: 3px; display: none; }
  .gbox.sel .hd { display: block; }
  .hd-n { top: -7px; left: calc(50% - 6px); cursor: ns-resize; } .hd-s { bottom: -7px; left: calc(50% - 6px); cursor: ns-resize; }
  .hd-e { right: -7px; top: calc(50% - 6px); cursor: ew-resize; } .hd-w { left: -7px; top: calc(50% - 6px); cursor: ew-resize; }
  .hd-ne { top: -7px; right: -7px; cursor: nesw-resize; } .hd-sw { bottom: -7px; left: -7px; cursor: nesw-resize; }
  .hd-nw { top: -7px; left: -7px; cursor: nwse-resize; } .hd-se { bottom: -7px; right: -7px; cursor: nwse-resize; }
  .free { position: absolute; pointer-events: none; background: repeating-linear-gradient(45deg, rgba(255,166,0,.4) 0 3px, transparent 3px 8px); }
  .coords { position: absolute; right: 4px; bottom: 4px; z-index: 5; background: rgba(0,0,0,.75); color: #fff; font-size: 11px;
            padding: 1px 6px; border-radius: 3px; font-variant-numeric: tabular-nums; pointer-events: none; }
  .pos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0 8px; }
  .lines2 { display: flex; gap: 16px; flex-wrap: wrap; }
</style>
</head>
<body data-pane="blocks">
<header class="appbar">
  <h1>ESPink</h1>
  <nav class="tabs"><a href="./" aria-current="page" id="tabLayout">Rozvržení</a><a href="status">Stav</a><a href="settings">Systém</a></nav>
  <div class="actions">
    <button class="icon-btn" id="histBtn" title="Historie uložených verzí"><i class="mdi mdi-history"></i></button>
    <button class="icon-btn" id="exportBtn" title="Exportovat rozvržení (JSON)"><i class="mdi mdi-download"></i></button>
    <button class="icon-btn" id="importBtn" title="Importovat rozvržení ze souboru"><i class="mdi mdi-upload"></i></button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
</header>
<div id="banners"></div>
<div class="seg" role="group" aria-label="Zobrazení">
  <button aria-pressed="true" data-p="blocks">Bloky</button><button aria-pressed="false" data-p="preview" id="segPrev">Náhled</button>
</div>

<main>
  <section id="editCol" aria-label="Bloky">
    <div class="card budget">
      <div class="budget-head"><span>Mřížka 12 sloupců po 40 px, krok 4 px</span><span id="cover"></span></div>
      <div class="budget-msg" id="budgetMsg" aria-live="polite"></div>
      <div class="tools">
        <button class="txtbtn" id="stackBtn" title="Viditelné bloky srovná pod sebe na celou šířku (v pořadí shora)"><i class="mdi mdi-view-sequential-outline"></i>Seřadit pod sebe</button>
      </div>
    </div>
    <ul class="blocks" id="blocks"><li class="skel"></li><li class="skel"></li><li class="skel"></li><li class="skel"></li></ul>
    <div class="add">
      <button class="txtbtn" id="addBtn" aria-haspopup="menu" aria-expanded="false"><i class="mdi mdi-plus"></i>Přidat blok</button>
      <div class="card menu" id="addMenu" role="menu" hidden></div>
    </div>
  </section>

  <section id="previewCol" aria-label="Náhled">
    <div class="card">
      <div class="ptool">
        <span class="st" id="pstat" aria-live="polite">Načítám…</span>
        <label class="worst" title="Vynutí upozornění v záhlaví a výluku v odjezdech – nejméně místa pro události"><input type="checkbox" id="worst">Nejhorší případ</label>
        <button class="icon-btn" id="gridBtn" title="Mřížka 10/50 px" aria-pressed="false"><i class="mdi mdi-grid"></i></button>
        <div class="segbtn" role="group" aria-label="Měřítko">
          <button aria-pressed="true" data-z="fit" title="Přizpůsobit oknu"><i class="mdi mdi-fit-to-screen-outline"></i></button>
          <button aria-pressed="false" data-z="1" title="Skutečná velikost 1:1">1:1</button>
        </div>
        <button class="icon-btn" id="refresh" title="Obnovit náhled (načte čerstvá data z HA)"><i class="mdi mdi-refresh"></i></button>
      </div>
      <div class="stage">
        <div class="frame"><div class="screen busy" id="screen" style="--s:.75">
          <img id="pimg" alt="Náhled displeje" width="480" height="800">
          <div id="boxes"></div><div class="spin"></div><div class="coords" id="coords" hidden></div>
          <div class="perr" id="perr"></div>
        </div></div>
      </div>
    </div>
  </section>
</main>

<div class="savebar" id="savebar" role="region" aria-label="Neuložené změny">
  <span class="st" id="dirtyText">Neuložené změny</span>
  <button class="icon-btn" id="undo" title="Zpět (Ctrl+Z)"><i class="mdi mdi-undo"></i></button>
  <button class="icon-btn" id="redo" title="Znovu (Ctrl+Shift+Z)"><i class="mdi mdi-redo"></i></button>
  <button class="txtbtn" id="discard">Zahodit</button>
  <button class="primary" id="save">Uložit</button>
</div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastAct" hidden>Vrátit</button></div>
<div class="sr" aria-live="polite" id="live"></div>
<dialog id="conflict"><h3 style="margin-top:0">Rozvržení bylo mezitím uloženo jinde</h3>
  <p>V jiné kartě (nebo jiným uživatelem) byla uložena novější verze. Co s tím?</p>
  <div class="dlg-foot"><button class="txtbtn" id="cfTheirs">Načíst uložené</button><button class="primary" id="cfMine">Přepsat mými</button></div></dialog>
<dialog id="iconDlg"><h3 style="margin:0 0 10px">Vybrat ikonu</h3>
  <input type="search" id="iconSearch" placeholder="Hledat anglicky: thermometer, bus, trash…" autocomplete="off">
  <div class="icons" id="iconGrid"></div>
  <div class="dlg-foot"><button class="txtbtn" id="iconNone">Bez vlastní ikony</button><button class="txtbtn" onclick="iconDlg.close()">Zavřít</button></div></dialog>
<dialog id="histDlg"><h3 style="margin:0">Uložené verze</h3>
  <ul class="hist" id="histList"></ul>
  <div class="dlg-foot"><button class="txtbtn" onclick="histDlg.close()">Zavřít</button></div></dialog>

<script>
"use strict";
// ───────── Typy bloků (popisy pro UI; parametry a výšky posílá server) ─────────
const TYPES = {
  header:     { icon: "page-layout-header", desc: "Datum, jmeniny, svátek, upozornění, počasí teď" },
  departures: { icon: "bus", desc: "Odjezdová tabule a výluky – počet spojů podle výšky" },
  agenda:     { icon: "calendar-text", desc: "Kalendáře – počet událostí podle výšky" },
  weather_now: { icon: "thermometer", desc: "Aktuální počasí samostatně (ikona, teplota, vlhkost…)" },
  forecast:   { icon: "weather-partly-cloudy", desc: "Předpověď na několik dní" },
  footer:     { icon: "page-layout-footer", desc: "Čas aktualizace, další obnovení, týden, baterie" },
  value:      { icon: "numeric", desc: "Jedna hodnota s ikonou a popiskem (lze přidat víckrát)" },
  text:       { icon: "format-text", desc: "Pevný text, např. vzkaz nebo heslo k Wi-Fi" },
  template:   { icon: "code-braces", desc: "Vlastní Jinja/HTML – pro pokročilé" },
};
const SIZES = { s: "Malá", m: "Střední", l: "Velká" };
let SCHEMA = null, D = null;          // popis bloků a rozměry ze serveru
let ENT = null;                       // id → {name, state, unit}; null = HA nedostupné
let unsavedBanner = null, rev = 0;
let blocks = [], saved = "[]", hist = [], hpos = 0, openId = null;

const $ = s => document.querySelector(s);
const el = (t, a = {}, ...k) => { const e = Object.assign(document.createElement(t), a); k.forEach(x => x != null && e.append(x)); return e; };
const icon = n => el("i", { className: "mdi mdi-" + n });
const say = t => { $("#live").textContent = t; };
const name = t => SCHEMA.types[t].title;
const snap = () => JSON.stringify(blocks);

// layout.json (ploché bloky) ↔ editor ({id, type, hidden, x, y, w, h, line_top, line_left, p})
const fromServer = l => l.blocks.map(({ id, type, hidden, x, y, w, h, line_top, line_left, ...p }) =>
  ({ id, type, hidden: !!hidden, x, y, w, h, line_top, line_left, p }));
const toServer = () => ({ rev, blocks: blocks.map(({ p, ...g }) => ({ ...g, ...p })) });

// ───────── Historie (undo/redo) ─────────
function commit() {
  const s = snap();
  if (s === hist[hpos]) return;
  hist = hist.slice(0, hpos + 1); hist.push(s); if (hist.length > 50) hist.shift(); hpos = hist.length - 1;
  refresh();
}
function travel(d) { if (hpos + d < 0 || hpos + d >= hist.length) return; hpos += d; blocks = JSON.parse(hist[hpos]); refresh(); }

// ───────── Mřížka (stejná pravidla jako layout.py) ─────────
const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
const shown = () => blocks.filter(b => !b.hidden);
const clashes = b => b.hidden ? [] : shown().filter(o => o !== b && overlap(o, b));
const inside = r => r.x >= 0 && r.w >= 1 && r.x + r.w <= D.cols && r.y >= 0 && r.h >= D.step && r.y + r.h <= D.h;
const fits = (r, except) => inside(r) && !shown().some(o => o !== except && o.id !== r.id && overlap(o, r));
const minOf = t => SCHEMA.types[t].min;
const tooSmall = b => b.w < minOf(b.type)[0] || b.h < minOf(b.type)[1];
const fmtPos = b => `sl. ${b.x + 1}–${b.x + b.w} · y ${b.y} · ${b.w * D.col_w}×${b.h} px`;

function findSpot(type, w, h) {     // první volné místo shora; zkusí i menší rozměr až po minimum
  const [mw, mh] = minOf(type);
  for (const hh of [...new Set([h, Math.max(mh, Math.round(h / 2 / D.step) * D.step), mh])])
    for (let ww = w; ww >= Math.min(mw, w); ww--)
      for (let y = 0; y + hh <= D.h; y += D.step)
        for (let x = 0; x + ww <= D.cols; x++)
          if (fits({ x, y, w: ww, h: hh })) return { x, y, w: ww, h: hh };
  return null;
}
function freeRects() {               // volná místa: po sloupcích svisle, pak sloučit sousední sloupce
  const cols = [];
  for (let c = 0; c < D.cols; c++) {
    const busy = shown().filter(b => c >= b.x && c < b.x + b.w).sort((a, b) => a.y - b.y);
    let y = 0; const runs = [];
    for (const b of busy) { if (b.y > y) runs.push([y, b.y - y]); y = Math.max(y, b.y + b.h); }
    if (y < D.h) runs.push([y, D.h - y]);
    cols.push(runs);
  }
  const out = [];
  cols.forEach((runs, c) => runs.forEach(([y, h]) => {
    const prev = out.find(r => r.y === y && r.h === h && r.x + r.w === c);
    if (prev) prev.w++; else out.push({ x: c, y, w: 1, h });
  }));
  return out;
}
function renderStatus() {            // vrací true, když návrh nejde uložit (překryv)
  const vis = shown(), area = D.cols * D.col_w * D.h;
  const used = vis.reduce((s, b) => s + b.w * D.col_w * b.h, 0);
  const bad = vis.filter(b => clashes(b).length), small = vis.filter(tooSmall);
  $("#cover").textContent = `pokryto ${Math.min(100, Math.round(used / area * 100))} %`;
  const msg = $("#budgetMsg");
  let cls = "ok", txt = "Bloky tahej v náhledu, roztahuj za úchyty; šipky posouvají vybraný blok (Shift+šipky mění velikost).";
  if (bad.length) { cls = "err"; txt = `Bloky ${[...new Set(bad.map(b => name(b.type)))].join(", ")} se překrývají – posuň je, jinak nejde uložit.`; }
  else if (small.length) { cls = "warn"; txt = `${small.map(b => name(b.type)).join(", ")}: menší než doporučeno – obsah se nemusí vejít.`; }
  else if (used < area) txt = "Volná místa jsou v náhledu šrafovaná. " + txt;
  msg.className = "budget-msg " + cls;
  msg.replaceChildren(icon(cls === "ok" ? "check-circle" : cls === "err" ? "alert-circle" : "alert"), el("span", { textContent: txt }));
  $("#save").disabled = bad.length > 0;
  $("#save").title = bad.length ? "Nelze uložit: bloky se překrývají" : "";
  return bad.length > 0;
}

// ───────── Formuláře ─────────
const known = id => !id || !ENT || id in ENT;
function entInfo(info, v, hint) {
  info.replaceChildren(); info.className = "ent";
  if (!v) info.textContent = hint || "nepovinné";
  else if (!ENT) info.textContent = "nelze ověřit – HA nedostupné";
  else if (!(v in ENT)) { info.className = "ent bad"; info.append(icon("alert"), " Entita v HA neexistuje"); }
  else { const e = ENT[v]; info.append((e.name || v) + " · ", el("b", { textContent: fmtState(e) })); }
}
function fmtState(e) {               // „11.5735855102539“ → „11,6 °C“, ISO čas → místní čas
  let s = e.state ?? "";
  if (/^-?\d+\.\d{2,}$/.test(s)) s = (+s).toLocaleString("cs-CZ", { maximumFractionDigits: 1 });
  else if (/^\d{4}-\d\d-\d\dT/.test(s) && !isNaN(Date.parse(s))) s = new Date(s).toLocaleString("cs-CZ", { dateStyle: "short", timeStyle: "short" });
  return (s + (e.unit ? " " + e.unit : "")) || "—";
}
function entityField(label, b, key, domain, hint) {
  const id = `f${b.id}-${key}`;
  const inp = el("input", { type: "text", value: b.p[key] || "", placeholder: domain === "all" ? "sensor.…, binary_sensor.…" : domain + ".…", spellcheck: false, id });
  inp.setAttribute("list", "dl-" + domain);
  const info = el("div", { className: "ent", id: id + "i" });
  inp.setAttribute("aria-describedby", id + "i");
  const upd = () => { const v = inp.value.trim(); inp.setAttribute("aria-invalid", !known(v)); entInfo(info, v, hint); };
  inp.oninput = upd;
  inp.onchange = () => { b.p[key] = inp.value.trim(); commit(); };
  upd();
  return el("label", { className: "f", htmlFor: id }, el("span", { textContent: label }), inp, info);
}
const numField = (label, b, key, hint) => {
  const [, min, max] = SCHEMA.types[b.type].params[key].kind;
  const i = el("input", { type: "number", value: b.p[key], min, max });
  i.oninput = () => { const v = Math.max(min, Math.min(max, parseInt(i.value, 10) || min)); b.p[key] = v; refresh(true); };
  i.onchange = () => { i.value = b.p[key]; hist[hpos] === snap() ? refresh() : commit(); };
  return el("label", { className: "f" }, el("span", { textContent: label + (hint ? " – " + hint : "") }), i);
};
const textField = (label, b, key, ph) => {
  const i = el("input", { type: "text", value: b.p[key] || "", placeholder: ph || "" });
  i.onchange = () => { b.p[key] = i.value.trim(); commit(); };
  return el("label", { className: "f" }, el("span", { textContent: label }), i);
};
function iconField(label, obj, key, ph, dropEmpty) {   // obj = b.p nebo položka kalendáře
  const set = v => { obj[key] = v; if (!v && dropEmpty) delete obj[key]; commit(); };
  const i = el("input", { type: "text", value: obj[key] || "", placeholder: ph || "mdi:…" });
  i.onchange = () => set(i.value.trim());
  const prev = el("i", { className: "mdi mdi-" + String(obj[key] || "").replace(/^mdi:/, ""), style: "font-size:24px;width:28px;text-align:center" });
  const pick = el("button", { className: "icon-btn", title: "Vybrat ikonu", type: "button" }, icon("magnify"));
  pick.onclick = e => { e.preventDefault(); pickIcon(set); };
  if (!label) {                       // kompaktní varianta do řádku kalendáře: jen tlačítko s ikonou
    const name = String(obj[key] || "").replace(/^mdi:/, "");
    const btn = el("button", { className: "txtbtn", type: "button", title: name ? "Ikona " + name + " (změnit)" : "Ikona z HA (změnit)",
                               style: "padding:6px 4px;width:100%;justify-content:center" },
                   name ? icon(name) : el("span", { textContent: ph, style: "font-size:12px" }));
    btn.onclick = e => { e.preventDefault(); pickIcon(set); };
    return btn;
  }
  const row = el("div", { className: "withbtn" }, prev, i, pick);
  return label ? el("label", { className: "f" }, el("span", { textContent: label }), row) : row;
}
const areaField = (label, b, key, cls, ph, help) => {
  const t = el("textarea", { className: "code " + (cls || ""), value: b.p[key] || "", placeholder: ph || "", spellcheck: false });
  if (!cls) t.style.font = "inherit";
  t.onchange = () => { b.p[key] = t.value; commit(); };
  return el("label", { className: "f" }, el("span", { textContent: label }), t, help || null);
};
const selectField = (label, b, key, options) => {
  const sel = el("select");
  for (const [v, t] of Object.entries(options)) sel.append(el("option", { value: v, textContent: t, selected: b.p[key] === v }));
  sel.onchange = () => { b.p[key] = sel.value; commit(); };
  return el("label", { className: "f" }, el("span", { textContent: label }), sel);
};
const chk = (label, b, key) => {
  const i = el("input", { type: "checkbox", checked: !!b.p[key] });
  i.onchange = () => { b.p[key] = i.checked; commit(); };
  return el("label", { className: "chk" }, i, label);
};

function calRows(b) {
  const box = el("div", { className: "f" }, el("span", { textContent: "Kalendáře" }));
  box.append(el("div", { className: "calrow", style: "font-size:12px;color:var(--muted)" },
    el("span", { textContent: "Entita" }), el("span", { textContent: "Štítek" }), el("span", { textContent: "Ikona" }), el("span", { textContent: "Červeně" }), el("span")));
  b.p.calendars.forEach((c, i) => {
    const ent = el("input", { type: "text", value: c.entity, placeholder: "calendar.…", spellcheck: false }); ent.setAttribute("list", "dl-calendar");
    ent.setAttribute("aria-label", "Kalendář"); ent.setAttribute("aria-invalid", !known(c.entity));
    ent.onchange = () => { c.entity = ent.value.trim(); commit(); };
    const lab = el("input", { type: "text", value: c.label || "", placeholder: "—" }); lab.setAttribute("aria-label", "Štítek");
    lab.onchange = () => { c.label = lab.value.trim(); if (!c.label) delete c.label; commit(); };
    const ic = iconField("", c, "icon", "z HA", true);
    const red = el("input", { type: "checkbox", checked: !!c.red, style: "width:18px;height:18px;margin-top:8px;accent-color:#db4437" });
    red.setAttribute("aria-label", "Červeně (a upozornění v záhlaví)");
    red.onchange = () => { if (red.checked) c.red = true; else delete c.red; commit(); };
    const del = el("button", { className: "icon-btn", title: "Odebrat kalendář", style: "width:32px;height:32px" }, icon("close"));
    del.onclick = () => { b.p.calendars.splice(i, 1); commit(); };
    const nm = el("div", { className: "ent" }); entInfo(nm, c.entity, "");
    box.append(el("div", { className: "calrow" }, el("div", {}, ent, nm), lab, ic, red, del));
  });
  const add = el("button", { className: "txtbtn" }, icon("plus"), "Přidat kalendář");
  add.onclick = () => { b.p.calendars.push({ entity: "" }); commit(); requestAnimationFrame(() => [...document.querySelectorAll(`[data-id="${b.id}"] .calrow input[list]`)].pop()?.focus()); };
  box.append(add);
  return box;
}

const weatherFields = b => [
  entityField("Počasí (ikona, min/max)", b, "weather", "weather"),
  el("div", { className: "grid2" }, entityField("Venkovní teplota", b, "temperature", "sensor", "jinak z entity počasí"),
    entityField("Vlhkost", b, "humidity", "sensor", "jinak z entity počasí"),
    entityField("Srážky dnes", b, "rain", "sensor"), entityField("Tlak", b, "pressure", "sensor"), entityField("Teplota doma", b, "indoor", "sensor"))];

function params(b) {
  switch (b.type) {
    case "header": return [
      el("div", { className: "grid2" }, entityField("Kalendář jmenin", b, "nameday_calendar", "calendar"), entityField("Státní svátky", b, "holiday_calendar", "calendar")),
      chk("Upozornění z červených kalendářů (dnes/zítra)", b, "alert"),
      chk("Aktuální počasí vpravo", b, "show_weather"),
      ...(b.p.show_weather ? weatherFields(b) : [])];
    case "weather_now": return weatherFields(b);
    case "departures": return [
      entityField("Odjezdová tabule", b, "entity", "sensor", "senzor …_odjezdy z ha-pid-odjezdy"),
      entityField("Výluky", b, "disruptions", "sensor", "při výluce se zobrazí o 1 spoj méně"),
      el("div", { className: "grid2" }, numField("Cesta na zastávku", b, "walk_minutes", "min")),
      el("div", { className: "help", textContent: "Počet spojů se řídí výškou bloku (30 px na spoj)." })];
    case "agenda": return [calRows(b), el("div", { className: "grid2" }, numField("Dní dopředu (vždy)", b, "days"),
      entityField("Státní svátky jako řádek", b, "holiday_calendar", "calendar"))];
    case "forecast": return [el("div", { className: "grid2" }, entityField("Počasí", b, "weather", "weather"), numField("Počet dní", b, "days"))];
    case "footer": return [el("div", { className: "grid2" }, chk("Čas aktualizace", b, "updated"), chk("Další obnovení", b, "next"),
      chk("Číslo týdne", b, "week"), chk("Baterie", b, "battery"))];
    case "value": {
      const e = ENT && ENT[b.p.entity];
      return [entityField("Entita", b, "entity", "all"),
        el("div", { className: "grid2" },
          textField("Popisek", b, "label", e ? e.name : "název z HA"),
          iconField("Ikona", b.p, "icon", "z HA"),
          numField("Desetinná místa", b, "decimals"),
          textField("Červeně pod", b, "red_below", "např. 18"),
          textField("Červeně nad", b, "red_above", "např. 1200"))];
    }
    case "text": return [
      areaField("Text (každý řádek zvlášť)", b, "text", "", "Wi-Fi: Hosté / heslo"),
      el("div", { className: "grid2" },
        selectField("Velikost písma", b, "size", Object.fromEntries(Object.entries(SIZES).map(([k, t]) => [k, t]))),
        selectField("Zarovnání", b, "align", { left: "vlevo", center: "na střed" }),
        el("div", {}, chk("Tučně", b, "bold"), chk("Červeně", b, "red")))];
    case "template": return [
      areaField("Šablona (Jinja + HTML)", b, "code", "", "", el("div", { className: "help", innerHTML:
        "Funkce <code>states('sensor.x')</code>, <code>state_attr('sensor.x', 'attr')</code>, <code>is_state('…', 'on')</code>, <code>now</code>; " +
        "filtr <code>|num(1)</code> zformátuje číslo česky (11,6). " +
        "Třídy <code>red</code>, <code>num</code>, <code>cond</code>, <code>ellipsis</code>, ikony <code>&lt;i class=\"mdi mdi-bus\"&gt;</code>. " +
        "Běží v sandboxu; skripty a síť jsou při vykreslení zakázané. Chyba se ukáže červeně v náhledu." }))];
  }
  return [];
}

function entName(id, strip) { return id ? ((ENT && ENT[id] && ENT[id].name) || id).replace(strip || /$^/, "") : "nenastaveno"; }
function summary(b) {
  const p = b.p;
  switch (b.type) {
    case "header": return [p.alert && "upozornění", p.show_weather && "počasí"].filter(Boolean).join(" · ") || "datum";
    case "weather_now": return entName(p.temperature || p.weather);
    case "departures": return entName(p.entity, / odjezdy$/i);
    case "agenda": return `${p.calendars.length} kalendářů · ${p.days} dní`;
    case "forecast": return `${entName(p.weather)} · ${p.days} dny`;
    case "value": return entName(b.p.entity);
    case "text": return (b.p.text.split("\n")[0] || "prázdný").slice(0, 40);
    case "template": return `${b.p.code.length} znaků`;
    case "footer": return Object.entries({ updated: "aktualizace", next: "obnovení", week: "týden", battery: "baterie" }).filter(([k]) => p[k]).map(([, v]) => v).join(", ") || "prázdná";
  }
  return "";
}
const ENT_KEYS = Object.freeze(["entity", "disruptions", "weather", "temperature", "humidity", "rain", "pressure", "indoor", "nameday_calendar", "holiday_calendar"]);
const invalid = b => !!ENT && (ENT_KEYS.some(k => typeof b.p[k] === "string" && !known(b.p[k]))
                               || (b.p.calendars || []).some(c => !known(c.entity)));

// ───────── Seznam bloků ─────────
function posFields(b) {
  const f = (label, key, toUser, fromUser, min, max, step) => {
    const i = el("input", { type: "number", value: toUser(b[key]), min, max, step });
    i.onchange = () => {
      const r = { ...b, [key]: fromUser(+i.value) };
      if (!fits(r, b)) { toast(inside(r) ? "Tam už je jiný blok." : "Blok by přesáhl displej."); i.value = toUser(b[key]); return; }
      b[key] = r[key]; commit();
    };
    return el("label", { className: "f" }, el("span", { textContent: label }), i);
  };
  return el("div", { className: "pos" },
    f("Sloupec", "x", v => v + 1, v => v - 1, 1, D.cols, 1),
    f("Šířka (sl.)", "w", v => v, v => v, 1, D.cols, 1),
    f("Shora (px)", "y", v => v, v => Math.round(v / D.step) * D.step, 0, D.h - D.step, D.step),
    f("Výška (px)", "h", v => v, v => Math.round(v / D.step) * D.step, D.step, D.h, D.step));
}

    const x = el("button", { textContent: l }); x.setAttribute("aria-pressed", b[key] === v); x.onclick = () => { b[key] = v; commit(); }; seg.append(x); });
  return el("div", { className: "f" }, el("span", { textContent: label }), seg);
}
function renderList() {
  const ul = $("#blocks");

  const order = [...blocks].sort((a, b) => a.hidden - b.hidden || a.y - b.y || a.x - b.x);
  for (const b of order) {
    const t = TYPES[b.type], open = openId === b.id;
    const tog = el("button", { className: "btoggle" },
      el("b", {}, name(b.type), invalid(b) ? el("span", { className: "badge" }, "⚠ entita") : null,
        clashes(b).length ? el("span", { className: "badge" }, "překryv") : null,
        b.hidden ? el("span", { className: "badge muted", textContent: "skrytý" }) : null),
      el("small", { textContent: summary(b) }));
    tog.setAttribute("aria-expanded", open);
    tog.onclick = () => { openId = open ? null : b.id; refresh(true); renderList(); };
    const hEl = el("span", { className: "bh", textContent: b.hidden ? "—" : `${b.w * D.col_w}×${b.h}` });
    const eye = el("button", { className: "icon-btn", title: b.hidden ? "Zobrazit" : "Skrýt" }, icon(b.hidden ? "eye-off" : "eye"));
    eye.setAttribute("aria-pressed", b.hidden);
    eye.onclick = () => toggleHidden(b);
    const li = el("li", { className: "card blk" + (open ? " open" : "") + (b.hidden ? " hidden-blk" : "") },
      el("div", { className: "bhead" }, el("div", { className: "bicon" }, icon(t.icon)), tog, hEl, eye));
    li.dataset.id = b.id;
    li.onmouseenter = () => hl(b.id, true); li.onmouseleave = () => hl(b.id, false);
    if (open) {
      const body = el("div", { className: "bbody" }, posFields(b),
        el("div", { className: "lines2" }, lineSeg(b, "line_top", "Čára nahoře"), lineSeg(b, "line_left", "Čára vlevo")),

function guess(domain, re) {           // předvyplnit, je-li v HA jediná vhodná entita
  if (!ENT) return "";

  return c.length === 1 ? c[0] : "";
}
function newBlock(type) {

  for (const [k, d] of Object.entries(SCHEMA.types[type].params)) p[k] = JSON.parse(JSON.stringify(d.default));
  if ("weather" in p) p.weather = guess("weather");
  const hdr = blocks.find(b => b.type === "header");
  if (type === "weather_now" && hdr) for (const k of ["weather", "temperature", "humidity", "rain", "pressure", "indoor"]) p[k] = hdr.p[k] || p[k];
  if (type === "forecast" && hdr && hdr.p.weather) p.weather = hdr.p.weather;
  if (type === "departures") { p.entity = guess("sensor", /_odjezdy$/); p.disruptions = guess("sensor", /_vyluky$/); }

}

const scale = () => parseFloat(getComputedStyle($("#screen")).getPropertyValue("--s")) || 1;

// Tažení a změna velikosti: přichytává se ke sloupcům (40 px) a svisle po 4 px
function startDrag(e, b, d, mode) {
  if (e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  d.setPointerCapture(e.pointerId);
  const s = scale(), sx = e.clientX, sy = e.clientY, o = { x: b.x, y: b.y, w: b.w, h: b.h };
  const [mw, mh] = [1, D.step];   // tvrdé minimum; doporučené minimum jen varuje
  let moved = false;
  if (openId !== b.id) { openId = b.id; renderList(); document.querySelectorAll(".gbox.sel").forEach(x => x.classList.remove("sel")); d.classList.add("sel"); }
  const coords = $("#coords");
  d.onpointermove = ev => {
    const dc = Math.round((ev.clientX - sx) / s / D.col_w), dy = Math.round((ev.clientY - sy) / s / D.step) * D.step;
    if (!moved && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) < 4) return;
    moved = true;
    const r = { ...o };
    if (mode === "move") {
      r.x = Math.max(0, Math.min(D.cols - o.w, o.x + dc)); r.y = Math.max(0, Math.min(D.h - o.h, o.y + dy));
    } else {
      if (mode.includes("e")) r.w = Math.max(mw, Math.min(D.cols - o.x, o.w + dc));
      if (mode.includes("s")) r.h = Math.max(mh, Math.min(D.h - o.y, o.h + dy));
      if (mode.includes("w")) { const nx = Math.max(0, Math.min(o.x + o.w - mw, o.x + dc)); r.w = o.w + o.x - nx; r.x = nx; }
      if (mode.includes("n")) { const ny = Math.max(0, Math.min(o.y + o.h - mh, o.y + dy)); r.h = o.h + o.y - ny; r.y = ny; }
    }
    Object.assign(b, r); place(d, r, s);
    d.classList.toggle("bad", clashes(b).length > 0);
    coords.hidden = false; coords.textContent = fmtPos(b) + (clashes(b).length ? " · překryv!" : "");
  };
  d.onpointerup = () => {
    d.onpointermove = d.onpointerup = null; coords.hidden = true;
    if (!moved) { openBlock(b.id); drawBoxes(); return; }
    if (clashes(b).length) {
      const other = clashes(b).map(x => name(x.type)).join(", ");
      Object.assign(b, o); drawBoxes(); toast(`Tam už je ${other} – blok vrácen zpět.`); return;
    }
    commit(); say(`${name(b.type)}: ${fmtPos(b)}`);
  };
}
function keyMove(e, b) {
  const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  if (!k) { if (e.key === "Enter") openBlock(b.id); return; }
  e.preventDefault();
  const step = e.altKey ? 10 * D.step : D.step, r = { ...b };
  if (e.shiftKey) { r.w += k[0]; r.h += k[1] * step; } else { r.x += k[0]; r.y += k[1] * step; }
  if (r.w < 1 || r.h < D.step || !fits(r, b)) return;
  Object.assign(b, { x: r.x, y: r.y, w: r.w, h: r.h }); commit(); say(`${name(b.type)}: ${fmtPos(b)}`);
  requestAnimationFrame(() => document.querySelector(`.gbox[data-id="${b.id}"]`)?.focus());
}

    if (!res.saved) unsavedBanner = banner("warn", "Rozvržení zatím není uložené – odvozuje se z nastavení add-onu. Po prvním uložení platí jen tento editor.");
    document.addEventListener("pointerdown", e => {   // klik mimo bloky v náhledu zruší výběr
      if (e.target.closest("#screen") && !e.target.closest(".gbox") && openId) { openId = null; refresh(true); renderList(); }
    });
    fit(); refresh(); scheduleRender(true);
  } catch (e) {
    banner("err", "Editor se nepodařilo načíst: " + e.message, () => location.reload());
  }
})();
</script>
</body>
</html>
