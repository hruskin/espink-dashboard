<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESPink – panely</title>
<link rel="stylesheet" href="static/mdi/css/materialdesignicons.min.css">
<style>
  :root {
    --bg: #fafafa; --card: #fff; --ink: #212121; --muted: #727272; --line: #e0e0e0; --hover: rgba(0,0,0,.04);
    --primary: #03a9f4; --on-primary: #fff; --err: #db4437; --warn: #ffa600; --ok: #43a047;
    --warn-bg: #fff4e0; --err-bg: #fdecea; --shadow: 0 2px 2px rgba(0,0,0,.14), 0 1px 5px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --card: #1c1c1c; --ink: #e1e1e1; --muted: #9b9b9b; --line: #333; --hover: rgba(255,255,255,.05);
            --warn-bg: #3a2c10; --err-bg: #3b1714; --shadow: none; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 Roboto, system-ui, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--primary); }
  .mdi { font-size: 20px; line-height: 1; }
  .appbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px;
            background: var(--card); border-bottom: 1px solid var(--line); }
  .appbar h1 { font-size: 20px; font-weight: 400; margin: 0 16px 0 0; }
  .tabs { display: flex; height: 100%; }
  .tabs a { display: flex; align-items: center; padding: 0 16px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; font-weight: 500; }
  .tabs a[aria-current] { color: var(--primary); border-color: var(--primary); }
  @media (max-width: 600px) { .appbar h1 { display: none; } .tabs a { padding: 0 10px; } }
  main { max-width: 900px; margin: 0 auto; padding: 16px 16px 48px; }
  h2 { font-size: 16px; font-weight: 500; margin: 20px 4px 8px; color: var(--muted); }
  .card { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--line); margin-bottom: 12px; }
  .phead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .phead b { font-size: 16px; font-weight: 500; }
  .phead small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--hover); color: var(--muted); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
  .chip .mdi { font-size: 14px; }
  .chip.bad { background: var(--err-bg); color: var(--err); }
  .chip.warn { background: var(--warn-bg); }
  .pbody { display: grid; grid-template-columns: 150px 1fr; gap: 16px; padding: 16px; }
  .thumb { width: 150px; border: 1px solid var(--line); background: #fff; image-rendering: pixelated; align-self: start; }
  @media (max-width: 560px) { .pbody { grid-template-columns: 1fr; } .thumb { width: 120px; } }
  .f { display: block; margin-bottom: 12px; }
  .f > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .f input, .f select, .f textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
  .f textarea { font: 13px/1.45 ui-monospace, "JetBrains Mono", monospace; min-height: 72px; resize: vertical; }
  .f :focus { outline: 2px solid var(--primary); border-color: transparent; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
  .withbtn { display: flex; gap: 4px; align-items: center; }
  .withbtn > :first-child { flex: 1; min-width: 0; }
  .help { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .help code { background: var(--hover); padding: 0 3px; border-radius: 3px; }
  .foot { display: flex; gap: 8px; align-items: center; border-top: 1px dashed var(--line); padding: 10px 0 0; flex-wrap: wrap; }
  /* rozepsaný panel: lišta s Uložit/Zahodit zůstane vidět dole u okna */
  .card.dirty .foot { position: sticky; bottom: 0; z-index: 5; background: var(--card); padding-bottom: 10px; box-shadow: 0 -6px 8px -6px rgba(0,0,0,.15); }
  .foot .unsaved { display: none; color: var(--muted); font-size: 13px; gap: 6px; align-items: center; }
  .card.dirty .foot .unsaved { display: inline-flex; }
  .foot .unsaved::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .chip.act { cursor: pointer; border: 0; font: inherit; font-size: 12px; }
  .thumbbtn { border: 0; padding: 0; background: none; cursor: zoom-in; align-self: start; }
  dialog { border: 0; border-radius: 12px; background: var(--card); color: var(--ink); padding: 20px; max-width: min(520px, calc(100vw - 32px)); box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .zoom img { width: 480px; max-width: 100%; height: auto; display: block; border: 1px solid var(--line); background: #fff; image-rendering: pixelated; }
  .foot .sp { flex: 1; }
  .txtbtn { background: none; border: 0; color: var(--primary); font-weight: 500; padding: 8px 10px; border-radius: 4px; display: inline-flex; gap: 4px; align-items: center; text-decoration: none; }
  .txtbtn:hover { background: var(--hover); }
  .txtbtn.danger { color: var(--err); }
  .primary { background: var(--primary); color: var(--on-primary); border: 0; border-radius: 4px; padding: 9px 18px; font-weight: 500; }
  .primary:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .primary.danger { background: var(--err); }
  .pend { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: end; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .pend:last-child { border-bottom: 0; }
  .pend .f { margin: 0; }
  @media (max-width: 700px) { .pend { grid-template-columns: 1fr; } }
  .empty { padding: 16px; color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #323232; color: #fff; padding: 12px 16px; border-radius: 6px;
           display: none; z-index: 40; max-width: calc(100vw - 32px); }
  .toast.show { display: block; }
  .banner { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; background: var(--err-bg); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  /* rozvrh probouzení: průběh dne + hodiny */
  .sched { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  .sched-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .sched-head b { font-weight: 500; }
  .sched-head small { color: var(--muted); }
  .sched-bar { display: flex; height: 34px; border-radius: 6px; overflow: hidden; }
  .sched-bar > button { color: #fff; font-size: 12px; font-weight: 500; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; cursor: pointer;
                     white-space: nowrap; overflow: hidden; border-right: 1px solid var(--card); min-width: 0; }
  .sched-bar > button:last-child { border-right: 0; }
  .sched-bar > button:hover, .sched-bar > button.on { filter: brightness(1.25); box-shadow: inset 0 -3px 0 #fff; }
  .sched-seg { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; margin: -4px 0 10px; padding: 8px 10px; border-radius: 8px; background: var(--hover); }
  .sched-seg select { width: auto; padding: 6px 8px; }
  details.sched-more > summary { cursor: pointer; color: var(--primary); font-weight: 500; font-size: 13px; padding: 4px 0; }
  details.sched-more[open] > summary { margin-bottom: 8px; }
  .sched-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
  .sched-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-bottom: 10px; }
  .sched-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .sched-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
  .sched-tools select { width: auto; padding: 6px 8px; }
  /* hodiny 0–23 v pořadí: na počítači dva sloupce (0–11 | 12–23), na telefonu pod sebou */
  .sched-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(12, auto); grid-auto-flow: column; gap: 6px 16px; }
  @media (max-width: 560px) { .sched-grid { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; } }
  .sched-grid label { display: grid; grid-template-columns: 92px 1fr; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
  .sched-grid select { padding: 6px 8px; border-left-width: 6px; }
  .sched-note { font-size: 12px; color: var(--muted); margin: 6px 0; }
  .sched-note.warn { color: var(--ink); background: var(--warn-bg); padding: 6px 8px; border-radius: 6px; }
</style>
</head>
<body>
<header class="appbar">
  <h1>ESPink</h1>
  <nav class="tabs"><a href="./">Rozvržení</a><a href="panels" aria-current="page">Panely</a><a href="install">Instalace</a><a href="status">Stav</a></nav>
</header>
<main>
  <div id="banners"></div>
  <div id="pendingBox"></div>
  <h2>Panely</h2>
  <div id="list"><div class="card empty">Načítám…</div></div>
  <p class="help">Každý panel (deska ESPink) zobrazuje jedno rozvržení – víc panelů může sdílet stejné.
    Rozvržení se upravují na kartě <a href="./">Rozvržení</a>. Nová deska se objeví nahoře, jakmile se poprvé ozve. Firmware do nové desky nahraješ na kartě <a href="install">Instalace</a>.</p>
</main>
<div class="toast" id="toast" role="status"></div>
<datalist id="dl-sensor"></datalist>

<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...k) => { const e = Object.assign(document.createElement(t), a); k.forEach(x => x != null && e.append(x)); return e; };
const icon = n => el("i", { className: "mdi mdi-" + n });
let DATA = null, dirty = new Set();

// potvrzovací dialog místo confirm() (v panelu HA nativní okna působí cize)
function ask(title, text, okLabel, danger) {
  return new Promise(res => {
    const ok = el("button", { className: danger ? "primary danger" : "primary", textContent: okLabel });
    const no = el("button", { className: "txtbtn", textContent: "Zrušit" });
    const d = el("dialog", {}, el("h3", { textContent: title, style: "margin:0 0 8px" }), el("p", { textContent: text, style: "margin:0" }),
                 el("div", { className: "dlg-foot" }, no, ok));
    const done = v => { d.close(); d.remove(); res(v); };
    ok.onclick = () => done(true); no.onclick = () => done(false); d.oncancel = () => done(false);
    document.body.append(d); d.showModal(); ok.focus();
  });
}

let tt;
function toast(text) { const t = $("#toast"); t.textContent = text; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 5000); }

async function post(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(res.error || "HTTP " + r.status);
  return res;
}
// „Kuchyň“ -> sensor.espink_kuchyn_baterie (stejně jako server)
const suggest = name => "sensor.espink_" + (name.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase()
  .replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "panel") + "_baterie";

function ago(iso) {
  if (!iso) return "zatím se neozval";
  const d = new Date(iso), min = Math.round((Date.now() - d) / 60000);
  if (min < 1) return "ozval se právě teď";
  if (min < 60) return `ozval se před ${min} min`;
  return "ozval se " + d.toLocaleString("cs-CZ", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" });
}
function layoutSelect(value) {
  const s = el("select");
  for (const l of DATA.layouts) s.append(el("option", { value: l.id, textContent: l.name, selected: l.id === value }));
  return s;
}
const field = (label, input, help) => el("label", { className: "f" }, el("span", { textContent: label }), input, help || null);

// ───────── Rozvrh probouzení: 24 hodin, v každé interval (inspirace Živý obraz) ─────────
// Server dál dostává pravidla „HH:MM-HH:MM=sekundy“ (spojené stejné sousední hodiny);
// probuzení jsou zarovnaná na násobky intervalu (5 min = :00, :05, …; hodina = v :00).
const SLOTS = [
  { v: 300, label: "každých 5 min", short: "5 min", color: "#0d47a1" },
  { v: 600, label: "každých 10 min", short: "10 min", color: "#0277bd" },
  { v: 900, label: "každých 15 min", short: "15 min", color: "#4527a0" },
  { v: 1200, label: "každých 20 min", short: "20 min", color: "#00695c" },
  { v: 1800, label: "každých 30 min", short: "30 min", color: "#2e7d32" },
  { v: 3600, label: "1× za hodinu (v :00)", short: "1×/h", color: "#5d4037" },
  { v: 0, label: "nebudit", short: "spí", color: "#616161" },
];
const slot = v => SLOTS.find(s => s.v === v) || SLOTS[SLOTS.length - 1];
const RULE_RE = /^\s*(?:(\d)(?:-(\d))?\s+)?(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})\s*=\s*(\d+)\s*$/;
const pad2 = n => String(n).padStart(2, "0");

// pravidla -> 24 hodin; null = nejde zobrazit (dny v týdnu, minuty, jiný interval).
// lossy: přibližně – za hodinu nejčastější interval, který v ní kdekoli platí (dny se ignorují),
// takže převod nikdy nevytvoří hodinu „nebudit“ tam, kde se původně budilo
const toSlot = v => SLOTS.filter(s => s.v && s.v <= v).reduce((a, s) => Math.max(a, s.v), 0) || 300;
function rulesToHours(rules, lossy) {
  const wins = [];
  for (const r of rules.filter(x => x.trim())) {
    const m = RULE_RE.exec(r);
    if (!m) return null;
    const [, d1, d2, h1, m1, h2, m2, sec] = m;
    const allDays = !d1 || (d1 === "1" && d2 === "7");
    const v = Math.max(60, +sec);
    if (!lossy && (!allDays || m1 !== "00" || m2 !== "00" || !SLOTS.some(s => s.v === v))) return null;
    wins.push([+h1 * 60 + +m1, (+h2 % 24) * 60 + +m2, lossy ? toSlot(v) : v]);
  }
  const at = t => wins.find(([a, b]) => a < b ? t >= a && t < b : (t >= a || t < b));   // první vyhovující (jako server)
  return Array.from({ length: 24 }, (_, h) => {
    if (!lossy) { const w = at(h * 60); return w ? w[2] : 0; }
    const vs = Array.from({ length: 60 }, (_, mi) => at(h * 60 + mi)).filter(Boolean).map(w => w[2]);
    return vs.length ? Math.min(...vs) : 0;
  });
}
// 24 hodin -> pravidla; stejné sousední hodiny (i přes půlnoc) v jednom pravidle
function hoursToRules(hours) {
  if (hours.every(v => v === hours[0])) return hours[0] ? [`00:00-00:00=${hours[0]}`] : [];
  const start = hours.findIndex((v, i) => v !== hours[(i + 23) % 24]);
  const out = [];
  for (let k = 0; k < 24;) {
    const a = (start + k) % 24, v = hours[a];
    let n = 1;
    while (k + n < 24 && hours[(start + k + n) % 24] === v) n++;
    if (v) out.push(`${pad2(a)}:00-${pad2((a + n) % 24)}:00=${v}`);
    k += n;
  }
  return out.sort();
}
const wakesPerDay = hours => hours.reduce((s, v) => s + (v ? 3600 / v : 0), 0);

function scheduleEditor(p, onChange) {
  const inherited = !p.schedule.length;            // panel zatím jede podle výchozího rozvrhu add-onu
  let rules = inherited ? [...DATA.default_schedule] : [...p.schedule];
  let custom = !inherited, advanced = rulesToHours(rules) === null;
  let seg = null, gridOpen = false, convert = false;   // vybraný úsek pruhu, rozbalená mřížka, dotaz na převod
  const box = el("div", { className: "sched" });
  const changed = () => { custom = true; onChange(); draw(); };
  function draw() {
    const exact = rulesToHours(rules);
    const hours = exact || rulesToHours(rules, true);   // pokročilý rozvrh: pruh aspoň přibližně
    box.replaceChildren();
    const count = hours ? Math.round(wakesPerDay(hours)) : null;
    const toggle = el("button", { className: "txtbtn", type: "button", style: "padding:2px 6px" },
      icon(advanced ? "view-grid-outline" : "code-tags"), advanced ? "Po hodinách" : "Pokročilé (pravidla)");
    toggle.onclick = () => {
      if (advanced && !rulesToHours(rules)) {
        if (!rulesToHours(rules, true)) { toast("Nejdřív oprav pravidla – některý řádek nedává smysl."); return; }
        convert = true; draw(); return;          // zeptat se přímo v rozvrhu
      }
      advanced = !advanced; seg = null; draw();
    };
    box.append(el("div", { className: "sched-head" },
      el("div", {}, el("b", { textContent: "Průběh dne" }), " ",
        el("small", { textContent: count === null ? "· pravidla obsahují chybu" : `· ${exact ? "" : "přibližně "}${count} probuzení za den` })), toggle));
    if (inherited && !custom) box.append(el("div", { className: "sched-note", textContent: "Panel zatím používá výchozí rozvrh add-onu (Konfigurace add-onu v HA) – úpravou a uložením získá vlastní." }));
    if (hours) {
      const bar = el("div", { className: "sched-bar" });
      for (let h = 0; h < 24;) {                     // úseky po stejném intervalu
        let n = 1;
        while (h + n < 24 && hours[h + n] === hours[h]) n++;
        const s = slot(hours[h]);
        const from = h, to = h + n;
        const b = el("button", { type: "button", className: seg && seg[0] === from && seg[1] === to ? "on" : "",
                                 style: `flex:${n};background:${s.color}`, title: `${from}:00–${to}:00 · ${s.label}${advanced ? "" : " (klikni pro změnu)"}`,
                                 textContent: n >= 2 ? s.short : "" });
        b.setAttribute("aria-label", `${from}:00 až ${to}:00, ${s.label}`);
        b.onclick = () => { if (advanced) return; seg = seg && seg[0] === from && seg[1] === to ? null : [from, to]; draw(); };
        bar.append(b);
        h += n;
      }
      box.append(bar, el("div", { className: "sched-axis" }, ...[0, 3, 6, 9, 12, 15, 18, 21, 24].map(x => el("span", { textContent: x }))));
      const used = [...new Set(hours)];
      box.append(el("div", { className: "sched-legend" }, ...SLOTS.filter(s => used.includes(s.v)).map(s =>
        el("span", {}, el("i", { style: "background:" + s.color }), s.label))));
    }
    if (convert) {
      const yes = el("button", { className: "primary", type: "button", textContent: "Převést na hodiny" });
      const no = el("button", { className: "txtbtn", type: "button", textContent: "Ponechat pravidla" });
      yes.onclick = () => { rules = hoursToRules(rulesToHours(rules, true)); custom = true; convert = false; advanced = false; onChange(); draw(); };
      no.onclick = () => { convert = false; draw(); };
      box.append(el("div", { className: "sched-note warn" },
        "Rozvrh obsahuje dny v týdnu nebo minuty, hodinová mřížka je nezná. Při převodu dostane každá hodina nejčastější interval, který v ní platí – jako pruh nahoře.",
        el("div", { className: "dlg-foot", style: "margin-top:8px" }, no, yes)));
    }
    if (advanced) {
      const ta = el("textarea", { value: rules.join("\n"), spellcheck: false, rows: Math.max(4, rules.length + 1) });
      ta.oninput = () => { rules = ta.value.split("\n").map(x => x.trim()).filter(Boolean); custom = true; onChange(); };
      ta.onblur = draw;
      ta.onchange = draw;
      box.append(el("label", { className: "f", style: "margin:0" }, ta), el("div", { className: "help", innerHTML:
        "Jedno pravidlo na řádek: <code>[dny ]HH:MM-HH:MM=sekundy</code>, dny 1=Po … 7=Ne, platí první vyhovující. Mimo pravidla deska spí." }));
      const bad = rules.filter(r => !RULE_RE.test(r));
      if (bad.length) box.append(el("div", { className: "sched-note warn", textContent: `Tenhle řádek nedává smysl: „${bad[0]}“ – formát je HH:MM-HH:MM=sekundy.` }));
      else if (!exact && custom) box.append(el("div", { className: "sched-note", textContent: "Rozvrh obsahuje dny v týdnu, minuty nebo jiný interval – v mřížce po hodinách ho nejde přesně zobrazit, pruh je přibližný." }));
      return;
    }
    if (seg) {   // úprava vybraného úseku pruhu
      const [from, to] = seg, sel = el("select");
      SLOTS.forEach(s => sel.append(el("option", { value: s.v, textContent: s.label, selected: s.v === hours[from] })));
      sel.onchange = () => { const hs = [...hours]; for (let h = from; h < to; h++) hs[h] = +sel.value; rules = hoursToRules(hs); seg = null; changed(); };
      const close = el("button", { className: "txtbtn", type: "button", title: "Zavřít" }, icon("close"));
      close.onclick = () => { seg = null; draw(); };
      box.append(el("div", { className: "sched-seg" }, el("b", { textContent: `${from}:00–${to - 1}:59` }), sel, close));
      requestAnimationFrame(() => sel.focus());
    } else box.append(el("div", { className: "help", style: "margin:-4px 0 8px" }, "Klikni na úsek pruhu a změň jeho interval, nebo uprav jednotlivé hodiny níže."));
    const all = el("select");
    all.append(el("option", { value: "", textContent: "nastavit všechny hodiny…" }), ...SLOTS.map(s => el("option", { value: s.v, textContent: s.label })));
    all.onchange = () => { if (all.value === "") return; rules = hoursToRules(Array(24).fill(+all.value)); changed(); };
    const more = el("details", { className: "sched-more", open: gridOpen }, el("summary", { textContent: "Upravit po hodinách" }));
    more.ontoggle = () => { gridOpen = more.open; };
    more.append(el("div", { className: "sched-tools" }, all));
    const grid = el("div", { className: "sched-grid" });
    const row = h => {
      const sel = el("select", { style: "border-left-color:" + slot(hours[h]).color });
      SLOTS.forEach(s => sel.append(el("option", { value: s.v, textContent: s.label, selected: s.v === hours[h] })));
      sel.onchange = () => { const hs = [...hours]; hs[h] = +sel.value; rules = hoursToRules(hs); changed(); };
      return el("label", {}, el("span", { textContent: `${h}:00–${h}:59` }), sel);
    };
    for (let h = 0; h < 24; h++) grid.append(row(h));   // pořadí 0–23, sloupce dělá CSS
    more.append(grid);
    box.append(more);
    if (!hours.some(Boolean)) box.append(el("div", { className: "sched-note warn", textContent: "Žádná hodina nebudí – panel by použil výchozí rozvrh add-onu." }));
  }
  draw();
  return { el: box, rules: () => (custom ? rules : []) };
}

function panelCard(p) {
  const d = p.device || {};
  const chips = el("div", { className: "chips" },
    p.allowed ? null : allowChip(p),
    el("span", { className: "chip" }, icon("clock-outline"), ago(d.last_seen)),
    d.battery != null ? el("span", { className: "chip" + (d.battery <= 15 ? " warn" : "") }, icon("battery"), `${d.battery} % · ${d.voltage} V`) : null,
    d.rssi != null ? el("span", { className: "chip" }, icon("wifi"), `${d.rssi} dBm`) : null,
    d.refresh_ms ? el("span", { className: "chip" + (d.refresh_ms > 40000 ? " bad" : ""), title: "Délka posledního překreslení displeje" },
                      icon("timer-outline"), (d.refresh_ms / 1000).toLocaleString("cs-CZ", { maximumFractionDigits: 1 }) + " s") : null,
    d.reset_reason && d.reset_reason !== "deepsleep" ? el("span", { className: "chip" + (d.reset_reason === "brownout" ? " bad" : ""), title: "Důvod posledního restartu" }, icon("restart"), d.reset_reason) : null,
    p.error ? el("span", { className: "chip bad", title: p.error }, icon("alert-circle"), "chyba vykreslení") : null);

  const name = el("input", { type: "text", value: p.name, maxLength: 40 });
  const lay = layoutSelect(p.layout);
  const edit = el("a", { className: "txtbtn", href: "./?l=" + encodeURIComponent(p.layout), title: "Upravit rozvržení" }, icon("pencil-outline"));
  lay.onchange = () => { edit.href = "./?l=" + encodeURIComponent(lay.value); };
  const sensor = el("input", { type: "text", value: p.battery_sensor, placeholder: "prázdné = nezapisovat", spellcheck: false });
  sensor.setAttribute("list", "dl-sensor");
  const sug = el("button", { className: "txtbtn", type: "button", title: "Navrhnout název senzoru podle názvu panelu" }, icon("auto-fix"), "Navrhnout");
  sug.onclick = () => { sensor.value = suggest(name.value.trim() || p.name); mark(); };
  const sched = scheduleEditor(p, () => mark());
  // otočení obrazu podle toho, jak je panel pověšený: obraz na výšku, 90° ↔ 270° = vzhůru nohama
  const flip = DATA.default_rotate === 270 ? 90 : 270;
  const rot = el("select");
  rot.append(el("option", { value: "", textContent: "Normálně" }),
             el("option", { value: String(flip), textContent: "Vzhůru nohama (otočeno o 180°)", selected: (p.rotate ?? DATA.default_rotate) === flip }));
  const save = el("button", { className: "primary", textContent: "Uložit", disabled: true });
  const discard = el("button", { className: "txtbtn", textContent: "Zahodit", hidden: true });
  const del = el("button", { className: "txtbtn danger" }, icon("delete-outline"), "Odebrat");
  let card = null;
  const mark = () => { save.disabled = false; discard.hidden = false; dirty.add(p.mac); card?.classList.add("dirty"); };
  discard.onclick = () => { dirty.delete(p.mac); render(); toast("Změny panelu zahozeny."); };
  [name, lay, sensor, rot].forEach(i => i.addEventListener("input", mark));

  save.onclick = async () => {
    save.disabled = true;
    try {
      DATA = await post("panels/save", { mac: p.mac, name: name.value, layout: lay.value, battery_sensor: sensor.value,
                                         schedule: sched.rules(), rotate: rot.value === "" ? null : +rot.value });
      dirty.delete(p.mac); render(); toast(`Panel ${name.value.trim()} uložen. Změna se projeví při příštím probuzení desky.`);
    } catch (e) { save.disabled = false; toast("Nelze uložit: " + e.message); }
  };
  del.onclick = async () => {
    if (!await ask(`Odebrat panel ${p.name}?`, `Deska ${p.mac} přestane dostávat obrázek. Až se znovu ozve, objeví se v Nových deskách a půjde znovu povolit.`, "Odebrat", true)) return;
    try { DATA = await post("panels/delete", { mac: p.mac }); dirty.delete(p.mac); render(); toast(`Panel ${p.name} odebrán.`); }
    catch (e) { toast("Nelze odebrat: " + e.message); }
  };
  const src = `preview.png?panel=${encodeURIComponent(p.mac)}&${p.content_ts}`;
  const img = el("img", { className: "thumb", src, alt: "Náhled panelu " + p.name, loading: "lazy" });
  const zoom = el("button", { className: "thumbbtn", type: "button", title: "Zobrazit náhled ve skutečné velikosti" }, img);
  zoom.onclick = () => {
    const d = el("dialog", { className: "zoom" }, el("img", { src, alt: "Náhled panelu " + p.name }),
      el("div", { className: "dlg-foot" }, el("a", { className: "txtbtn", href: "status", textContent: "Stav panelů" }),
        el("button", { className: "primary", textContent: "Zavřít", onclick: () => { d.close(); d.remove(); } })));
    d.onclick = e => { if (e.target === d) { d.close(); d.remove(); } };
    document.body.append(d); d.showModal();
  };
  card = el("section", { className: "card" + (dirty.has(p.mac) ? " dirty" : "") },
    el("div", { className: "phead" }, icon("tablet"), el("div", {}, el("b", { textContent: p.name }), el("br"), el("small", { textContent: p.mac })), chips),
    el("div", { className: "pbody" }, zoom, el("div", {},
      el("div", { className: "grid2" }, field("Název", name), field("Rozvržení", el("div", { className: "withbtn" }, lay, edit))),
      field("Otočení obrazu", rot, el("div", { className: "help", textContent: "Je-li obraz na panelu vzhůru nohama, zvol „Vzhůru nohama“. Projeví se při příštím probuzení desky." })),
      field("Senzor baterie v HA", el("div", { className: "withbtn" }, sensor, sug),
            el("div", { className: "help", textContent: DATA.mqtt
        ? "Panel má v Home Assistantu vlastní zařízení se stavem baterie, signálu a překreslení. Tady je jen název (ID) senzoru baterie – použije se při prvním vytvoření, později ho přejmenuješ přímo v HA. Nech prázdné, pokud stav v HA nechceš."
        : "Pod tímto názvem add-on zapisuje stav baterie do Home Assistantu. Nech prázdné, pokud ho nepotřebuješ." })),
      el("div", { className: "f" }, el("span", { textContent: "Rozvrh probouzení" }), sched.el,
        el("div", { className: "help", textContent: "Deska se jen zeptá na nový obsah; překresluje se, jen když se změnil. Méně probuzení = delší výdrž baterie." })),
      el("div", { className: "foot" }, save, discard, el("span", { className: "unsaved", textContent: "Neuložené změny" }), el("span", { className: "sp" }), del))));
  return card;
}

// nepovolená deska: povolit přímo z karty (klíč desky se vezme z jejího posledního pokusu o spojení)
function allowChip(p) {
  const b = el("button", { className: "chip bad act", type: "button", title: "Deska nedostává obrázek – povolit" }, icon("lock-alert"), "nepovolená · Povolit");
  b.onclick = async () => {
    try { DATA = await post("panels/approve", { mac: p.mac }); render(); toast(`Deska panelu ${p.name} povolena.`); }
    catch (e) { toast("Nelze povolit: " + e.message); }
  };
  return b;
}

function pendingRow(p) {
  const known = p.mac && p.mac !== "(bez MAC)";
  const name = el("input", { type: "text", placeholder: "např. Kuchyň", maxLength: 40 });
  const lay = layoutSelect(DATA.layouts[0]?.id);
  const ok = el("button", { className: "primary", disabled: !known }, "Povolit");
  ok.onclick = async () => {
    ok.disabled = true;
    try {
      DATA = await post("panels/approve", { mac: p.mac, name: name.value, layout: lay.value });
      render(); toast("Deska povolena. Obrázek dostane při příštím probuzení.");
    } catch (e) { ok.disabled = false; toast("Nelze povolit: " + e.message); }
  };
  // známý panel s jiným klíčem desky (např. po smazání flash) – jen znovu povolit
  const panel = DATA.panels.find(x => x.mac === p.mac);
  const info = p.allowed ? "povolená, zatím se neozvala"
    : [panel ? `panel ${panel.name}: deska se ozvala s jiným klíčem (přeinstalovaná?)` : "",
       p.when && "ozvala se " + p.when, p.ip, p.fw && "FW " + p.fw, p.voltage && p.voltage + " V"].filter(Boolean).join(" · ");
  return el("div", { className: "pend" },
    el("div", {}, el("b", { textContent: p.mac }), el("div", { className: "help", textContent: info })),
    ...(p.allowed ? [el("span"), el("span"), el("span")] : panel ? [el("span"), el("span"), ok] : [field("Název panelu", name), field("Rozvržení", lay), ok]));
}

function render() {
  const list = $("#list");
  // rozepsané karty nepřekreslovat (zachovat neuložené úpravy)
  const keep = new Map([...list.querySelectorAll("section[data-mac]")].filter(s => dirty.has(s.dataset.mac)).map(s => [s.dataset.mac, s]));
  list.replaceChildren();
  if (!DATA.panels.length) list.append(el("div", { className: "card empty", textContent: "Zatím žádný panel – první deska, která se ozve, se přidá sama." }));
  for (const p of DATA.panels) {
    const c = keep.get(p.mac) || panelCard(p);
    c.dataset.mac = p.mac; list.append(c);
  }
  const box = $("#pendingBox"); box.replaceChildren();
  if (DATA.pending.length) box.append(el("h2", { textContent: "Nové desky" }),
    el("div", { className: "card" }, ...DATA.pending.map(pendingRow)),
    el("p", { className: "help", textContent: "Desky, které se ozvaly, ale nejsou povolené. Povolením dostanou obrázek a vlastní panel." }));
}

async function load() {
  try {
    const [d, ents] = await Promise.all([fetch("panels.json").then(r => r.json()),
      fetch("entities.json").then(r => r.ok ? r.json() : []).catch(() => [])]);
    DATA = d;
    const dl = $("#dl-sensor"); dl.replaceChildren();
    (Array.isArray(ents) ? ents : []).filter(e => e.id.startsWith("sensor.espink")).forEach(e => dl.append(el("option", { value: e.id, textContent: e.name })));
    render();
  } catch (e) {
    $("#banners").replaceChildren(el("div", { className: "banner", textContent: "Panely se nepodařilo načíst: " + e.message }));
  }
}
addEventListener("beforeunload", e => { if (dirty.size) e.preventDefault(); });
// nové desky a stav se objeví bez obnovení stránky
setInterval(() => { if (!document.hidden && !document.activeElement.matches("input,textarea,select")) load(); }, 30000);
load();
</script>
</body>
</html>
