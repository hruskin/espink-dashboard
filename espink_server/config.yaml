name: ESPink Server
version: "0.1.0"
slug: espink_server
description: Lokální server protokolu Živý obraz – kreslí dashboard z dat Home Assistantu pro e-paper ESPink
arch:
  - aarch64
  - amd64
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:tablet-dashboard
panel_title: ESPink
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: HTTP pro zařízení ESPink (protokol Živý obraz)
options:
  rotate: 90
  image_format: z2
  render_interval: 60
  meteo_temperature: sensor.temperature_10
  meteo_humidity: sensor.humidity_11
  meteo_rain_today: sensor.zahrada_meteo_denni_uhrn_srazek
  weather: weather.chmu_home_predpoved
  departures: sensor.odjezdova_tabule_krizkovy_ujezdec_odjezdy
  disruptions: sensor.odjezdova_tabule_krizkovy_ujezdec_vyluky
  departures_count: 5
  walk_minutes: 0
  calendars:
    - entity: calendar.rodina
    - entity: calendar.martin_hruska
    - entity: calendar.tam
    - entity: calendar.skolka
      label: Školka
    - entity: calendar.plavani
      label: Plavání
    - entity: calendar.narozeniny_2
      red: true
    - entity: calendar.svoz_popelnice
      red: true
  nameday_calendar: calendar.jmenne_svatky_ceske
  holiday_calendar: calendar.ceske_statni_svatky
  event_days: 7
  schedule:
    - "1-5 05:45-08:30=300"
    - "06:00-22:30=1200"
  battery_sensor: sensor.espink_baterie
schema:
  rotate: list(0|90|180|270)
  image_format: list(z2|png)
  render_interval: int(30,600)
  meteo_temperature: str?
  meteo_humidity: str?
  meteo_rain_today: str?
  meteo_pressure: str?
  indoor_temperature: str?
  weather: str?
  departures: str?
  disruptions: str?
  departures_count: int(0,10)
  walk_minutes: int(0,30)
  calendars:
    - entity: str
      label: str?
      red: bool?
  nameday_calendar: str?
  holiday_calendar: str?
  event_days: int(1,31)
  schedule:
    - str
  battery_sensor: str?
